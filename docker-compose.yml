services:
  postgres:
    image: postgres:16-alpine
    container_name: cosmo-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: cosmo_db
    volumes:
      - cosmo_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d cosmo_db"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  cosmo_pg_data:
