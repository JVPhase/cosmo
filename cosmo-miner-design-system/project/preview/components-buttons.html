<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#050918; padding:16px; font-family:-apple-system,sans-serif; display:flex; flex-wrap:wrap; gap:14px; align-items:flex-start; }
  .section { font-size:7px; font-weight:900; letter-spacing:2px; color:rgba(0,212,255,0.4); text-transform:uppercase; margin-bottom:8px; }
  .col { display:flex; flex-direction:column; gap:6px; }
  /* buttons */
  .btn { display:inline-flex; align-items:center; justify-content:center; padding:10px 20px; border-radius:8px; font-size:11px; font-weight:900; letter-spacing:1px; border:1px solid; cursor:pointer; text-transform:uppercase; }
  .btn-cyan { background:rgba(0,212,255,0.10); border-color:rgba(0,212,255,0.35); color:#00d4ff; }
  .btn-gold { background:rgba(255,200,0,0.12); border-color:rgba(255,200,0,0.50); color:#ffd700; }
  .btn-danger { background:rgba(255,40,40,0.10); border-color:rgba(255,80,80,0.35); color:rgba(255,100,100,0.85); }
  .btn-disabled { background:rgba(255,255,255,0.03); border-color:rgba(255,255,255,0.07); color:rgba(255,255,255,0.2); cursor:not-allowed; }
  /* floating btn */
  .fab { width:36px; height:36px; border-radius:10px; background:rgba(0,212,255,0.07); border:1px solid rgba(0,212,255,0.2); display:flex; align-items:center; justify-content:center; font-size:16px; }
  .fab-gold { background:rgba(255,200,0,0.10); border-color:rgba(255,200,0,0.45); }
  .fab-row { display:flex; gap:8px; }
  /* bar */
  .bar-wrap { width:200px; }
  .bar-label-row { display:flex; justify-content:space-between; margin-bottom:4px; }
  .bar-label { font-size:7px; font-weight:800; letter-spacing:2px; color:rgba(255,255,255,0.3); text-transform:uppercase; }
  .bar-val { font-size:7px; color:rgba(255,100,100,0.7); font-weight:800; }
  .bar-bg { height:10px; border-radius:5px; background:rgba(255,255,255,0.06); overflow:hidden; border:1px solid rgba(255,255,255,0.08); }
  .bar-fill-hp { height:100%; border-radius:5px; background:linear-gradient(90deg,#cc2222,#ff4444); }
  .bar-fill-xp { height:100%; border-radius:5px; background:rgba(0,212,255,0.6); }
  .bar-fill-gold { height:100%; border-radius:5px; background:linear-gradient(90deg,#996600,#ffd700); }
</style>
</head>
<body>
<div>
  <div class="section">Primary Buttons</div>
  <div class="col">
    <button class="btn btn-cyan">ИССЛЕДОВАТЬ</button>
    <button class="btn btn-gold">КУПИТЬ  25 000 ⚡</button>
    <button class="btn btn-danger">✕ ОТСТУПИТЬ</button>
    <button class="btn btn-disabled">НЕДОСТУПНО</button>
  </div>
</div>
<div>
  <div class="section">Floating Action Buttons</div>
  <div class="fab-row">
    <div class="fab">🔬</div>
    <div class="fab">🏆</div>
    <div class="fab">📖</div>
    <div class="fab fab-gold">⭐</div>
  </div>
</div>
<div>
  <div class="section">Progress Bars</div>
  <div class="col" style="gap:10px">
    <div class="bar-wrap">
      <div class="bar-label-row"><span class="bar-label">HP</span><span class="bar-val">12 400 / 30 000</span></div>
      <div class="bar-bg"><div class="bar-fill-hp" style="width:41%"></div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-label-row"><span class="bar-label" style="color:rgba(0,212,255,0.5)">XP</span><span style="font-size:7px;color:rgba(0,212,255,0.4);font-weight:800">ЛВЛ 7</span></div>
      <div class="bar-bg"><div class="bar-fill-xp" style="width:62%"></div></div>
    </div>
    <div class="bar-wrap">
      <div class="bar-label-row"><span class="bar-label" style="color:rgba(255,200,0,0.5)">ЗАРЯД УЛЬТ</span><span style="font-size:7px;color:rgba(255,200,0,0.4);font-weight:800">3/5</span></div>
      <div class="bar-bg"><div class="bar-fill-gold" style="width:60%"></div></div>
    </div>
  </div>
</div>
</body>
</html>
