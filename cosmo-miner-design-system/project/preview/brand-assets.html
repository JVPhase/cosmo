<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#050918; padding:16px; font-family:-apple-system,sans-serif; }
  .section { font-size:7px; font-weight:900; letter-spacing:2px; color:rgba(0,212,255,0.4); text-transform:uppercase; margin-bottom:10px; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .asset-card { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .asset-bg { width:72px; height:72px; border-radius:14px; background:#081630; border:1px solid rgba(0,212,255,0.12); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .asset-bg img { width:64px; height:64px; object-fit:contain; }
  .asset-lbl { font-size:7px; color:rgba(255,255,255,0.3); text-align:center; max-width:72px; font-weight:700; letter-spacing:0.5px; }
</style>
</head>
<body>
<div class="section">App Icons</div>
<div class="grid" style="margin-bottom:16px">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/icon.png"></div><div class="asset-lbl">App Icon</div></div>
  <div class="asset-card"><div class="asset-bg" style="background:#fff"><img src="../assets/android-icon-foreground.png"></div><div class="asset-lbl">Android FG</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/android-icon-background.png"></div><div class="asset-lbl">Android BG</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/android-icon-monochrome.png"></div><div class="asset-lbl">Android Mono</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/favicon.png"></div><div class="asset-lbl">Favicon</div></div>
</div>
<div class="section">Characters</div>
<div class="grid" style="margin-bottom:16px">
  <div class="asset-card"><div class="asset-bg" style="border-color:rgba(245,200,66,0.3)"><img src="../assets/characters/lien.png" style="width:100%;height:100%;object-fit:cover;object-position:top center"></div><div class="asset-lbl" style="color:#f5c842">Лиен</div></div>
  <div class="asset-card"><div class="asset-bg" style="border-color:rgba(66,232,196,0.3)"><img src="../assets/characters/riva.png" style="width:100%;height:100%;object-fit:cover;object-position:top center"></div><div class="asset-lbl" style="color:#42e8c4">Рива</div></div>
  <div class="asset-card"><div class="asset-bg" style="border-color:rgba(160,180,224,0.3)"><img src="../assets/characters/graves.png" style="width:100%;height:100%;object-fit:cover;object-position:top center"></div><div class="asset-lbl" style="color:#a0b4e0">Грейвс</div></div>
  <div class="asset-card"><div class="asset-bg" style="border-color:rgba(128,217,160,0.3)"><img src="../assets/characters/alex.png" style="width:100%;height:100%;object-fit:cover;object-position:top center"></div><div class="asset-lbl" style="color:#80d9a0">Алекс</div></div>
</div>
<div class="section">Planets (Sample)</div>
<div class="grid" style="margin-bottom:16px">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/asteroid.png"></div><div class="asset-lbl">Астероид Б-4</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/mercury.png"></div><div class="asset-lbl">Меркурий-Икс</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/crystal.png"></div><div class="asset-lbl">Кристаллис</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/nebula.png"></div><div class="asset-lbl">Туманность</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/sun.png"></div><div class="asset-lbl">Солнце</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/blackhole.png"></div><div class="asset-lbl">Чёрная дыра</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/singularity.png"></div><div class="asset-lbl">Сингулярность</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/planets/quantumfield.png"></div><div class="asset-lbl">Кванто. поле</div></div>
</div>
<div class="section">Ships (Fleet)</div>
<div class="grid">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/scoutship.png"></div><div class="asset-lbl">Разведчик</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/cruisership.png"></div><div class="asset-lbl">Крейсер</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/dreadnoughtship.png"></div><div class="asset-lbl">Дредноут</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/flagship.png"></div><div class="asset-lbl">Флагман</div></div>
</div>
</body>
</html>
