<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background:#050918; padding:16px; font-family:-apple-system,sans-serif; }
  .section { font-size:7px; font-weight:900; letter-spacing:2px; color:rgba(0,212,255,0.4); text-transform:uppercase; margin-bottom:10px; }
  .grid { display:flex; flex-wrap:wrap; gap:10px; }
  .asset-card { display:flex; flex-direction:column; align-items:center; gap:6px; }
  .asset-bg { width:72px; height:72px; border-radius:14px; background:#081630; border:1px solid rgba(0,212,255,0.12); display:flex; align-items:center; justify-content:center; overflow:hidden; }
  .asset-bg img { width:64px; height:64px; object-fit:contain; }
  .asset-lbl { font-size:7px; color:rgba(255,255,255,0.3); text-align:center; max-width:72px; font-weight:700; letter-spacing:0.5px; }
</style>
</head>
<body>
<div class="section">Cannons</div>
<div class="grid" style="margin-bottom:16px">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/cannons/standartcanon.png"></div><div class="asset-lbl">Стандартная</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/cannons/titancanon.png"></div><div class="asset-lbl">Титановая</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/cannons/iridiumcanon.png"></div><div class="asset-lbl">Иридиевая</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/cannons/alloycanon.png"></div><div class="asset-lbl">Сплавная</div></div>
</div>
<div class="section">Resources / Metals</div>
<div class="grid" style="margin-bottom:16px">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/resources/iron.png"></div><div class="asset-lbl">Железо</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/resources/titan.png"></div><div class="asset-lbl">Титан</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/resources/iridium.png"></div><div class="asset-lbl">Иридий</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/resources/echoshard.png"></div><div class="asset-lbl">Эхо-осколок</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/resources/voidcrystal.png"></div><div class="asset-lbl">Войд-кристалл</div></div>
</div>
<div class="section">Alien Ships (Guardians)</div>
<div class="grid">
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/fireship.png"></div><div class="asset-lbl">Пламенники</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/crystalship.png"></div><div class="asset-lbl">Кристаллиты</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/nebulaship.png"></div><div class="asset-lbl">Туманники</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/sunship.png"></div><div class="asset-lbl">Солярианцы</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/blackholeship.png"></div><div class="asset-lbl">Тёмные стражи</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/neitronship.png"></div><div class="asset-lbl">Нейтрониты</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/omegaship.png"></div><div class="asset-lbl">Парадоксусы</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/quantumship.png"></div><div class="asset-lbl">Квант. призраки</div></div>
  <div class="asset-card"><div class="asset-bg"><img src="../assets/ships/singularityship.png"></div><div class="asset-lbl">Сингуляты</div></div>
</div>
</body>
</html>
