<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<link rel="stylesheet" href="../colors_and_type.css">
<style>
  body { background: #0a0f1e; padding: 16px; font-family: -apple-system, sans-serif; }
  .row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
  .swatch { display: flex; flex-direction: column; align-items: center; gap: 4px; }
  .chip { width: 52px; height: 40px; border-radius: 8px; border: 1px solid rgba(255,255,255,0.08); }
  .lbl { font-size: 8px; font-weight: 800; letter-spacing: 1px; color: rgba(255,255,255,0.4); text-align: center; }
  .val { font-size: 7px; color: rgba(255,255,255,0.25); font-family: monospace; }
  .section { font-size: 8px; font-weight: 900; letter-spacing: 2px; color: rgba(0,212,255,0.5); margin-bottom: 6px; text-transform: uppercase; }
</style>
</head>
<body>
<div class="section">Backgrounds</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#050918;box-shadow:inset 0 0 0 1px rgba(255,255,255,0.15)"></div><div class="lbl">VOID</div><div class="val">#050918</div></div>
  <div class="swatch"><div class="chip" style="background:#04102d"></div><div class="lbl">SURFACE</div><div class="val">#04102d</div></div>
  <div class="swatch"><div class="chip" style="background:#081630"></div><div class="lbl">SURFACE 2</div><div class="val">#081630</div></div>
</div>
<div class="section" style="margin-top:4px">Cyan — Interface</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:rgba(0,212,255,0.08)"></div><div class="lbl">100</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(0,212,255,0.14)"></div><div class="lbl">200</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(0,212,255,0.25)"></div><div class="lbl">300</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(0,212,255,0.40)"></div><div class="lbl">400</div></div>
  <div class="swatch"><div class="chip" style="background:#00d4ff;box-shadow:0 0 12px rgba(0,212,255,0.6)"></div><div class="lbl">500</div><div class="val">#00d4ff</div></div>
</div>
<div class="section" style="margin-top:4px">Gold — Energiium™</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:rgba(255,200,0,0.10)"></div><div class="lbl">100</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(255,200,0,0.25)"></div><div class="lbl">200</div></div>
  <div class="swatch"><div class="chip" style="background:rgba(255,200,0,0.50)"></div><div class="lbl">300</div></div>
  <div class="swatch"><div class="chip" style="background:#f5c842"></div><div class="lbl">400</div><div class="val">#f5c842</div></div>
  <div class="swatch"><div class="chip" style="background:#ffd700;box-shadow:0 0 12px rgba(255,200,0,0.6)"></div><div class="lbl">500</div><div class="val">#ffd700</div></div>
</div>
<div class="section" style="margin-top:4px">Danger / Heal / Warning</div>
<div class="row">
  <div class="swatch"><div class="chip" style="background:#ff3333;box-shadow:0 0 10px rgba(255,60,60,0.5)"></div><div class="lbl">DANGER</div><div class="val">#ff3333</div></div>
  <div class="swatch"><div class="chip" style="background:#ff6666"></div><div class="lbl">DANGER LT</div><div class="val">#ff6666</div></div>
  <div class="swatch"><div class="chip" style="background:#44ff88;box-shadow:0 0 10px rgba(68,255,136,0.4)"></div><div class="lbl">HEAL</div><div class="val">#44ff88</div></div>
  <div class="swatch"><div class="chip" style="background:#ff9900"></div><div class="lbl">WARNING</div><div class="val">#ff9900</div></div>
</div>
</body>
</html>
