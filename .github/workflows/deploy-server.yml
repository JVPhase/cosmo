name: Deploy Server

on:
  push:
    branches: [main]
    paths:
      - "server/**"
      - "packages/game-config/**"
      - "compose.prod.yml"
      - ".github/workflows/deploy-server.yml"
  workflow_dispatch:

jobs:
  deploy:
    name: Deploy to production
    runs-on: ubuntu-latest
    environment: production

    steps:
      - name: Deploy via SSH
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT || 22 }}
          script: |
            set -e
            cd /opt/cosmo

            echo "==> Pulling latest code"
            git pull origin main

            echo "==> Rebuilding server image"
            docker compose --env-file .env.prod -f compose.prod.yml build server

            echo "==> Restarting server"
            docker compose --env-file .env.prod -f compose.prod.yml up -d --no-deps server

            echo "==> Done"
