server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    location = /crm {
        return 308 /crm/;
    }

    location ^~ /crm/ {
        try_files $uri $uri/ /crm/index.html;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
